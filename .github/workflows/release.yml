name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Use the newest stable Xcode so the Swift toolchain matches the local build.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Package DMG
        run: |
          mkdir -p dist
          hdiutil create -volname Kagemaku \
            -srcfolder /Applications/Kagemaku.app \
            -ov -format UDZO dist/Kagemaku.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kagemaku.dmg
          draft: false
          prerelease: false

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Kagemaku-DMG
          path: dist/Kagemaku.dmg
